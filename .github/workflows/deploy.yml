name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages is enabled
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")

          case "$status" in
            200)
              echo "GitHub Pages is enabled."
              ;;
            404)
              echo "::error title=GitHub Pages is not enabled::Enable Pages at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/pages and set Source to \"GitHub Actions\", then re-run this workflow."
              exit 1
              ;;
            *)
              echo "::warning title=Could not verify Pages configuration::The Pages API returned HTTP ${status}. Continuing; the deploy step will fail if Pages is not enabled."
              ;;
          esac

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
